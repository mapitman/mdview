name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 'Get Previous tag'
        id: previoustag
        uses: "WyriHaximus/github-action-get-previous-tag@v2"
      - name: Setup tools
        run: sudo apt-get install pandoc
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.21'
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Build
        run: |
          VERSION="${{ steps.previoustag.outputs.tag }}" just all
          VERSION="${{ steps.previoustag.outputs.tag }}" just deb
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          name: ${{ steps.previoustag.outputs.tag }}
          tag_name: ${{ steps.previoustag.outputs.tag }}
          files: |
            mdview-${{ steps.previoustag.outputs.tag }}-linux-amd64.tar.gz
            mdview-${{ steps.previoustag.outputs.tag }}-linux-i386.tar.gz
            mdview-${{ steps.previoustag.outputs.tag }}-linux-arm64.tar.gz
            mdview-${{ steps.previoustag.outputs.tag }}-darwin-amd64.tar.gz
            mdview-${{ steps.previoustag.outputs.tag }}-darwin-arm64.tar.gz
            mdview-${{ steps.previoustag.outputs.tag }}-windows-amd64.zip
            mdview-${{ steps.previoustag.outputs.tag }}-freebsd-amd64.tar.gz
            mdview_${{ steps.previoustag.outputs.tag }}_amd64.deb
            mdview_${{ steps.previoustag.outputs.tag }}_arm64.deb